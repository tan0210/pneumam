# Dataset config in the format of kohya's sd-scripts. Paths are relative to this file.

[general]
shuffle_caption = true
keep_tokens = 1
caption_extension = ".txt"

[[datasets]]
resolution = 1024

  [[datasets.subsets]]
  image_dir = "../data/mychar"
  num_repeats = 10
  caption_prefix = "mychar"
  flip_aug = true

  [[datasets.subsets]]
  image_dir = "../data/regularization"
  num_repeats = 1
  shuffle_caption = false
