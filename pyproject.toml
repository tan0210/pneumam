[project]
name = "pneumam"
version = "0.1.0"
description = "Pneumam"
readme = "README.md"
authors = [
    { name = "Tan", email = "173550691+tan0210@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.1",
    "numpy>=2.0",
    "safetensors>=0.5",
]

[project.optional-dependencies]
triton = [
    "triton>=3.3; sys_platform == 'linux'",
    "triton-windows>=3.3; sys_platform == 'win32'",
]
sm90 = [
    "pneumam[triton]",
    "quack-kernels[cu13]",
    "flash-attn-4>=4.0.0b38; sys_platform == 'linux'",
]
sm120 = [
    "pneumam[triton]",
    "warpy-kernels",
]
vae = [
    "ffpa-attn>=0.2.1",
]
text = [
    "tokenizers>=0.21",
    "huggingface-hub>=1.0",
]
convert = [
    "pneumam[text]",
    "diffusers>=0.42.1",
    "accelerate>=1.15.0",
]
hub = ["huggingface-hub>=1.0"]
comfyui = [
    "pneumam[convert,hub]",
    "torchvision",
    "torchsde",
    "comfyui-frontend-package==1.59.1",
    "comfyui-workflow-templates==0.11.107",
    "comfyui-embedded-docs==0.5.16",
    "comfy-aimdo==0.6.0",
    "comfy-kitchen==0.2.41",
    "einops",
    "tokenizers>=0.13.3",
    "aiohttp>=3.11.8",
    "yarl>=1.18.0",
    "pyyaml",
    "pillow>=12.0",
    "scipy",
    "tqdm>=4.66",
    "psutil",
    "alembic",
    "sqlalchemy>=2.0.0",
    "filelock",
    "av>=17.0.0",
    "requests",
    "simpleeval>=1.0.0",
    "blake3",
    "kornia>=0.7.1",
    "spandrel",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "pyopengl>=3.1.8",
    "comfy-angle",
]
cli = ["pillow>=12.0"]
train = ["tqdm>=4.66"]
bench = ["matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12", "transformers>=5.22.1"]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["*.py"]
addopts = "--import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning:(ffpa_attn|quack|cutlass).*",
    "ignore:cudaGetDeviceCount:UserWarning",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
warpy-kernels = { git = "https://github.com/tan0210/warpy-kernels" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
